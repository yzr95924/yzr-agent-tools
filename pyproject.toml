# 当前没有发布计划,只保留 pytest 跑测试所需的最小配置。
# Python 包安装走 scripts/<tool>.sh install(用 PYTHONPATH=$REPO/src 直接 import src/),不走 pip。

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest 必须能看到 src/ 与 tests/,这样不需要 venv 里的 .pth 也能 import model_switch
# 与 tests.conftest。
pythonpath = ["src", "tests"]
addopts = "-ra"
markers = [
    # Opt out of tests/conftest.py's autouse isolation fixture — only for tests
    # that intentionally exercise real path resolution (see test_paths.py).
    "no_isolation: skip the autouse real-config isolation fixture",
]