[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yzr-agent-tools"
version = "0.1.0"
description = "Quickly switch Claude Code's active model (Anthropic-compatible upstreams) without hand-editing config files."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [{ name = "yzr" }]
dependencies = [
    "typer>=0.9,<0.11",
    "click<8.2",
    "pydantic>=1.10,<2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8",
    "pytest-cov>=4.1",
]

[project.scripts]
yzr = "yzr_agent_tools.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"