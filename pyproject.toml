[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-switch"
version = "0.1.0"
description = "Quickly switch Claude Code's active model (Anthropic-compatible upstreams) without hand-editing config files."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [{ name = "model-switch contributors" }]
dependencies = [
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8",
    "pytest-cov>=4.1",
]

[project.scripts]
# Console-script entry for the future `pip install model-switch` path.
# scripts/install.sh does NOT call pip — the installed launcher is the
# bash wrapper at bin/model-switch, which uses PYTHONPATH=src/ to find
# the package directly. Keeping this entry preserves the ability to ship
# a normal pip-installable release later.
model-switch = "model_switch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest must see `src/` directly so `import model_switch` resolves without
# a venv-installed .pth file (the install flow no longer creates a venv).
pythonpath = ["src", "tests"]
addopts = "-ra"