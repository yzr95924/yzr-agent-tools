name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: py${{ matrix.python-version }}
    # Pinned to ubuntu-22.04: Python 3.7 (this project's stated floor) is NOT
    # available on ubuntu-24.04 / ubuntu-latest — 3.7 is EOL and was pruned
    # from those runners. If ubuntu-22.04 is ever retired by GitHub, move the
    # 3.7 entry onto a `container: python:3.7.17-slim` job instead.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.7 = project floor (exercises the typing.Protocol fallback shim +
        # tomli loader); 3.8 = first version with real typing.Protocol;
        # 3.11/3.12 = stdlib tomllib path. A regression of any 3.7-incompatible
        # import turns the 3.7 job red first.
        python-version: ["3.7", "3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test shells
        # zsh + fish drive the completion-script tests (tests/zsh_capture.zsh
        # needs a real zsh; fish tests skip if absent, but run them here).
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Install test deps
        # tomli is the TOML reader for Python <3.11 (harmless on 3.11+ where
        # tomllib is stdlib). pip's resolver honors Requires-Python, so on 3.7
        # it auto-selects the last 3.7-compatible pytest (7.4.x) / pytest-cov.
        run: pip install pytest pytest-cov 'tomli>=1.1'
      - name: Generate ./bin/ wrappers
        # bin/<tool> are gitignored install artifacts (see .gitignore: "re-run
        # scripts/<tool>.sh install after a fresh clone"). A fresh CI checkout
        # has none, so regenerate them here — several wrapper-content and
        # shell-completion tests read / shell out to bin/model-switch.
        run: |
          bash scripts/model-switch.sh install
          bash scripts/mcp-plugin-mgr.sh install
      - name: Run tests (debug output as annotations)
        run: |
          python3 -m pytest -x -q > /tmp/pytest.out 2>&1; rc=$?
          python3 - <<'PYEOF'
          import re
          out = open('/tmp/pytest.out').read()
          m = re.search(r'=+ FAILURES =+(.*?)(=+ short test summary|=+ [0-9]+ failed)', out, re.S)
          block = (m.group(1) if m else out)[-1500:]
          envline = 'env follows\n'
          print('::error title=pytest-failure::' + envline.replace('\n', '%0A'))
          print('::error title=pytest-failure-block::' + block.replace('\n', '%0A').replace('\r', ''))
          PYEOF
          exit $rc
